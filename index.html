<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://kit.fontawesome.com/7934089f60.js" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="css/style.css">
	<title>Home - Philippine American Progress School, Inc.</title>

<body>
	<header class="header">

			<div class="header-right">
				<div class="header-top">
					<div class="school-branding">

					<div class="social-links">

						<span><i class="fa-solid fa-phone"></i> 326-0755</span>
						<span><i class="fa-solid fa-mobile-screen-button"></i> (+63) 951-164-2161</span>

					<nav class="navlinks">
