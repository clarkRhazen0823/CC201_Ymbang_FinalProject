<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://kit.fontawesome.com/7934089f60.js" crossorigin="anonymous"></script>
	<link rel="stylesheet" href="css/style.css">
	<title>Home - PAPSI</title>
</head>

<body>
	<div id="school-header"></div>

	<main>
		<section class="empty">

		</section>
	</main>

	<div id="school-footer"></div>

	<script>
		function loadComponent(id, file) {
			fetch(file)
				.then(response => response.text())
				.then(data => {
					document.getElementById(id).innerHTML = data;
				});
		}

		loadComponent('school-header', 'components/header.html');
		loadComponent('school-footer', 'components/footer.html');
	</script>
</body>

</html>
